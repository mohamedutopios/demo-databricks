# API Ventes — couche gold (v1.2)
# Docker  : docker compose up -d --build
# Podman  : podman compose up -d --build
services:
  api:
    build:
      context: .
      target: production
    image: api-ventes-gold:1.2.0
    container_name: api-ventes-gold
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/vivant', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
